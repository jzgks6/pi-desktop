<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>pi desktop</title>
    <style>
      /* 启动页：Rust 壳先把这个页面显示出来，等服务真的起来再 navigate 过去，
         所以这里只需要「等待」这一件事，样式跟着 App 的暗色主题走。 */
      :root {
        color-scheme: dark;
        --bg: #131314;
        --text: #ececec;
        --text-dim: #74747a;
        --border: #2b2b2e;
      }
      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --bg: #ffffff;
          --text: #1a1a1a;
          --text-dim: #8a8a8a;
          --border: #e9e9e9;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        /* 这一步之前没有可交互的东西，光标保持默认箭头 */
        cursor: default;
      }
      .box { display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid var(--border);
        border-top-color: var(--text-dim);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      /* 尊重系统的“减弱动态效果” */
      @media (prefers-reduced-motion: reduce) {
        .spinner { animation: none; border-top-color: var(--text-dim); }
      }
      .label { color: var(--text-dim); letter-spacing: 0.01em; }
      .hint { display: none; max-width: 380px; text-align: center; color: var(--text-dim); }
      .hint code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        color: var(--text);
      }
      /* 超过 60s 还没起来就不装了：换掉转圈，直接给出日志位置 */
      body.timed-out .spinner { display: none; }
      body.timed-out .label { display: none; }
      body.timed-out .hint { display: block; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <div class="label">正在启动 pi desktop…</div>
      <div class="hint">
        启动超时。服务端日志在 <code id="logpath">~/Library/Logs</code> 下，
        文件名 <code>server.log</code>。
      </div>
    </div>
    <script>
      // 60 秒还没被 navigate 走，就认为服务起不来了
      setTimeout(() => document.body.classList.add("timed-out"), 60000);
    </script>
  </body>
</html>
